server {
    listen 80;
    server_name www.gbw3bao.com gbw3bao.com;

    # 静态前端（JS/CSS/JSON/SVG）文本压缩：yufan 讲义元数据 manifest.js ≈142KB → 约 30KB 传输。
    # 注意：本文件仅在部署时通过 scripts/deploy.ps1 -InstallNginxProxy 安装到
    #       /etc/nginx/conf.d/english-learn.conf，改完需重新安装并 reload 才生效。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
